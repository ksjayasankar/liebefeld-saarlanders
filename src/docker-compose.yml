services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: navigator, POSTGRES_USER: navigator, POSTGRES_PASSWORD: "${DB_PASSWORD}"}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5433:5432"]           # host-side development (decision D-03)
    healthcheck: {test: ["CMD", "pg_isready", "-U", "navigator"], interval: 5s, retries: 12}
  api:
    build: .
    env_file: .env
    environment: {DATABASE_URL: "postgresql://navigator:${DB_PASSWORD}@db:5432/navigator", TORCH_DEVICE: cpu}
    depends_on: {db: {condition: service_healthy}}
    volumes: ["./data:/app/data", "./config:/app/config", "./vocab:/app/vocab", "./eval:/app/eval", "models:/root/.cache/huggingface"]
    ports: ["8000:8000"]
    command: sh -c "navigator migrate && uvicorn navigator.api:app --host 0.0.0.0 --port 8000"
  web:
    build: ./web
    depends_on: [api]
    ports: ["8080:80"]
volumes: {pgdata: {}, models: {}}
