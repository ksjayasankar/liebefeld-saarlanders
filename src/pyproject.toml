[project]
name = "navigator"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "psycopg[binary,pool]>=3.3",
  "pgvector>=0.5",
  "fastapi>=0.145",
  "uvicorn>=0.38",
  "pydantic>=2.11",
  "httpx>=0.28",
  "beautifulsoup4>=4.13",
  "lxml>=6.0",
  "pyyaml>=6.0",
  "openai>=3.35",
  "numpy>=2.2",
  "torch>=2.14",
  "sentence-transformers>=6.1",
  "jinja2>=3.1",
  "weasyprint>=70.0",
  "matplotlib>=3.10",
  "pyarrow>=21.0",
  "docling>=2.140",
  "easyocr>=1.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4"]
render = ["playwright>=1.64"]   # hosts marked render: browser; then `playwright install --only-shell chromium`

[project.scripts]
navigator = "navigator.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["navigator"]

[tool.setuptools.package-data]
navigator = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
