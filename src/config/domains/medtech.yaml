# Domain pack: the only place where medtech appears (spec section 3).
id: medtech                      # also names the database schema: live_medtech
label: Medical technology
languages: [en, de, fr]
max_pages_per_host: 1500
templates:
  unibe_portal:                  # the shared UniBE web system
    main: "main#content"
    seeds: ["index_eng.html", "index_ger.html"]
    skip_without: "main"         # folder and link-list pages have no <main> at all
    people:                      # schema.org Person markup (D-26)
      - {card: '.team-box[itemtype$="schema.org/Person"]', name: "dd", function: ".jobTitle", link: "dd a[href]",
         email: "[itemprop=email]", phone: "[itemprop=telephone]"}
      - {card: '.team-detail[itemtype$="schema.org/Person"]', name: "[itemprop=name]", function: "[itemprop=jobTitle]",
         affiliation: "[itemprop=name] ~ p:not([itemprop])", email: "[itemprop=email]", phone: "[itemprop=telephone]"}
    drop: ["aside.contact-box", ".social-share", ".mdl-teaser_element", ".modal"]
    unit_paths:                  # /research/<code>/ is a unit; listing folders are not
      - "^/(?:research|forschung)/(?:platforms/|plattformen/|research_groups/|forschungsgruppen/|groups/|gruppen/)?(?!(?:publications|publikationen|projects|projekte|topics|themen|news|jobs|emeriti|ehemalige|former_[a-z_]+|ehemalige_forschungsgruppen|research_insights|preise_und_ehrungen|awards|platforms|plattformen|research_groups|forschungsgruppen|groups|gruppen)/)([a-z0-9_]+)/"
    page_types:
      members: "/(?:group_members|team(?:/[a-z0-9_]+)?|mitarbeitende|people|personen)/index_(?:eng|ger|fra)\\.html$"
      person: "/(?:persons|staff|personen|personen_all_[a-z_]+|group_members|team|mitarbeitende|people)/"
      facility: "/(?:services|dienstleistungen|platforms|plattformen|core_facilities)/"
      project: "/(?:projects|projekte|research_activities|forschungsaktivitaeten)/"
      news: "/(?:news|news_and_events|aktuell|medienmitteilungen|media_releases)/"
      other: ".*"
    alumni_headings: ["Alumni", "Former members", "Former Members", "Ehemalige", "Ehemalige Mitarbeitende"]
  wordpress:
    wp_api: /wp-json/wp/v2/
    wp_types: [project, pages, posts]   # publication posts carry no content
    unit_paths: ["^/en/focus-area-([a-z0-9-]+)/"]   # DCB focus areas
    page_types: {project: "^project$", news: "^post$", other: ".*"}
    strip_patterns: ["\\[/?et_pb_[^\\]]*\\]"]   # Divi page-builder shortcodes
  insel_typo3:                   # Inselspital clinic sites and inselgruppe.ch (TYPO3); language in the first path segment
    main: 'main[role="main"]'
    seeds: ["de/lehre-und-forschung", "de/ueber-uns/teams"]
    lang_segment: 0
    people:
      - {card: ".wrapper__person", name: ".person__title-name a.name", function: "span.position", link: ".person__title-name a.name"}
    page_types: {members: "/ueber-uns/teams/", person: "/details/person/", project: "/forschung", other: ".*"}
  bfh:                           # Bern University of Applied Sciences (Magnolia), research areas only
    main: 'div.main[role="main"]'
    drop: [".comp-navigation-bar", ".page-header__anchor-links", ".comp-teaser-list-managed-for-configured-teaser",
           ".comp-quick-link-list", ".comp-search-results", ".comp-sharelinks"]
    seeds: ["en/research/"]
    lang_segment: 0
    people:
      - {card: "div.teas-contact-teaser", name: "h2.teaser-name", function: "ul.teaser-text-list li",
         link: 'a[href*="/about-bfh/people/"]', phone: ":has(> i.icon-link_phone)"}
    page_types: {members: "/contacts/$", person: "/about-bfh/people/", project: "/research-projects/|/projects/",
                 facility: "/range-services/|consulting-services", news: "/news/", other: ".*"}
  be_advanced:                   # canton of Bern start-up and SME support (TYPO3); German pages have no language prefix
    main: "main.main"            # not bare main: a modal is a second <main>
    drop: [".t8_team__filter", ".t8_team-list__footer"]
    seeds: [""]
    lang_segment: 0
    default_lang: de
    people:
      - {card: ".t8_team-list__item", name: ".t8_team-list__title", function: ".t8_team-list__description"}
    page_types: {news: "/stories|/news", other: ".*"}
  swissmedic:                    # the federal regulator (AEM); language in the second path segment
    main: "div#content"
    seeds: ["swissmedic/en/home/medical-devices.html"]
    date_format: "%Y-%m-%d"
    lang_segment: 1
    page_types: {other: ".*"}
  innosuisse:                    # the federal innovation agency (Nuxt, rendered on the server)
    main: "main#main-content"
    seeds: ["en/support-offers", "en/support-for-start-ups", "en/life-sciences"]
    lang_segment: 0
    page_types: {other: ".*"}
  sipbb:                         # Switzerland Innovation Park Biel/Bienne (WordPress + Elementor, crawled as HTML); English has no prefix
    main: "main#content"
    skip_without: "main#content"   # Elementor landing pages have no content area
    seeds: ["", "park-biel-bienne/team/"]
    lang_segment: 0
    default_lang: en
    people:
      - {card: ".team_loop_item", name: '[data-widget_type="theme-post-title.default"]',
         function: '[data-widget_type="text-editor.default"]', email: 'a[href^="mailto:"]'}
    page_types: {members: "/team/", news: "/news/|/blog/", other: ".*"}
  sitem_insel:                   # sitem-insel AG (Nuxt; the HTML is empty until its scripts run: hosts use render: browser)
    main: "main"                 # pages: a layout-2 block; news: hero, text and gallery parts
    drop: ["main > footer", ".Breadcrumb"]
    skip_without: "main"         # some pages render nothing (client-side not-found pages)
    seeds: ["en/"]
    lang_segment: 0
    people:
      - {card: "div.content:has(> h4.member-title)", name: "h4.member-title", function: "span.role",
         email: ".member-details", phone: ".member-details"}
    page_types: {members: "/our-people$", facility: "/catr|/room-booking", news: "/news-list/|/info/news|/events", other: ".*"}
