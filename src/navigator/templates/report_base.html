<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>{% block title %}{% endblock %}</title><link rel="stylesheet" href="report.css"></head>
<body class="{% block audience %}{% endblock %}">
<div class="header"><img src="logo_kanton_bern.png" alt="Kanton Bern"><img src="logo_bern_economic.png" alt="Bern Economic Development Agency"></div>

<header class="title">
  <p class="kicker">{% block kicker %}{% endblock %}</p>
  <h1>{{ self.title() }}</h1>
  <p class="sub">{% block sub %}{% endblock %}</p>
</header>

{% block body %}{% endblock %}

<section>
  <h2>Sources</h2>
  <ol class="sources">{% for u in notes %}<li>{{ u }}</li>{% endfor %}</ol>
</section>
</body>
</html>
